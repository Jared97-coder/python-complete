[project]
name = "modulo-05-tipado-calidad"
version = "1.0.0"
description = "Módulo 5: Tipado Estático Opcional y Calidad de Código"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

# ============================================================================
# BLACK - FORMATEO DE CÓDIGO
# ============================================================================
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

# ============================================================================
# RUFF - LINTER Y FORMATEO
# ============================================================================
[tool.ruff]
target-version = "py311"
line-length = 88

# Directorios a excluir
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Reglas a activar
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RET", # flake8-return
]

# Reglas a ignorar
ignore = [
    "E501",  # Line too long (Black se encarga)
    "B008",  # Function call in argument defaults
]

# Auto-fix automático
fix = true
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# No reportar imports sin usar en __init__.py
"__init__.py" = ["F401"]
# Permitir asserts en tests
"test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["modulo_05"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Formato similar a Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# ISORT - ORDENAR IMPORTS
# ============================================================================
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ============================================================================
# MYPY - TYPE CHECKING
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # False para adopción gradual
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Ignorar imports faltantes de librerías externas
[[tool.mypy.overrides]]
module = [
    "requests.*",
    "pytest.*",
]
ignore_missing_imports = true

# ============================================================================
# PYTEST - TESTING
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",  # Show summary of all test outcomes
]

# ============================================================================
# COVERAGE - COBERTURA DE TESTS
# ============================================================================
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
