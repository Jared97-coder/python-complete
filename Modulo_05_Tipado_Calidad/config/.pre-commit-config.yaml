# Pre-commit configuration
# See https://pre-commit.com for more information
# 
# Instalación:
#   pip install pre-commit
#   pre-commit install
#
# Ejecutar manualmente:
#   pre-commit run --all-files
#   pre-commit run <hook-id>

repos:
  # Hooks básicos y útiles
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Eliminar espacios en blanco al final de líneas
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      
      # Asegurar nueva línea al final de archivo
      - id: end-of-file-fixer
      
      # Validar sintaxis de archivos
      - id: check-yaml
        args: [--safe]
      - id: check-json
      - id: check-toml
      
      # Evitar archivos grandes accidentales
      - id: check-added-large-files
        args: ['--maxkb=1000']
      
      # Detectar conflictos de merge no resueltos
      - id: check-merge-conflict
      
      # Detectar statements de debug (print, pdb, etc.)
      - id: debug-statements
      
      # Consistencia en line endings
      - id: mixed-line-ending
        args: [--fix=lf]
      
      # No permitir commits directos a main
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # Black - Formateo automático de código
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=88]

  # Ruff - Linting ultrarrápido
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      # Linter con auto-fix
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      
      # Formateo (alternativa a black - descomentar si no usas black)
      # - id: ruff-format

  # isort - Ordenar imports
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  # mypy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [
          types-requests,
          types-PyYAML,
        ]
        args: [
          --ignore-missing-imports,
          --check-untyped-defs,
        ]

  # Validación de docstrings (opcional)
  # - repo: https://github.com/pycqa/pydocstyle
  #   rev: 6.3.0
  #   hooks:
  #     - id: pydocstyle
  #       args: [--convention=google]

  # Análisis de seguridad (opcional)
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.6
  #   hooks:
  #     - id: bandit
  #       args: [-ll]  # Solo severidad media y alta

# Configuración global
default_language_version:
  python: python3.11

# Ejecutar ciertos hooks en stage específico
default_stages: [commit]

# Archivos/directorios a excluir globalmente
exclude: |
  (?x)^(
      migrations/.*|
      .*/migrations/.*|
      .*_pb2.py|
      docs/conf.py|
      build/.*|
      dist/.*|
      .venv/.*|
      venv/.*
  )$

# CI/skip: omitir todos los hooks
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
    
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
